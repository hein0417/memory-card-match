<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Card Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header>
  <h1>Memory Match</h1>
  <p>Flip cards · find pairs · beat your record</p>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Moves</div>
    <div class="stat-value" id="moves">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Pairs</div>
    <div class="stat-value" id="pairs">0 / 0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Time</div>
    <div class="stat-value" id="timer">0s</div>
  </div>
</div>

<div class="controls">
  <div class="difficulty-bar">
    <button class="diff-btn active" data-cols="4" onclick="setDifficulty(this)">Easy</button>
    <button class="diff-btn" data-cols="5" onclick="setDifficulty(this)">Medium</button>
    <button class="diff-btn" data-cols="6" onclick="setDifficulty(this)">Hard</button>
  </div>
  <button class="btn-primary" onclick="startGame()">New Game</button>
  <a href="leaderboard.html" class="btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center;">🏆 Leaderboard</a>
</div>

<div class="grid" id="grid" data-cols="4"></div>

<!-- WIN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="win-box">
    <span class="win-emoji">🎉</span>
    <h2>You Won!</h2>

    <div class="win-stats">
      <div class="win-stat">
        <span class="win-stat-label">Difficulty</span>
        <span class="win-stat-value" id="win-difficulty">Easy</span>
      </div>
      <div class="win-stat">
        <span class="win-stat-label">Moves</span>
        <span class="win-stat-value" id="win-moves">0</span>
      </div>
      <div class="win-stat">
        <span class="win-stat-label">Time</span>
        <span class="win-stat-value" id="win-time">0s</span>
      </div>
      <div class="win-stat">
        <span class="win-stat-label">Score</span>
        <span class="win-stat-value highlight" id="win-score">0</span>
      </div>
    </div>

    <p class="score-note">Score = moves × 10 + seconds &nbsp;·&nbsp; lower is better</p>

    <div class="nickname-row">
      <input type="text" id="nickname-input" placeholder="Enter your nickname…" maxlength="20"/>
      <button class="btn-primary" id="submit-btn" onclick="submitScore()">Submit</button>
    </div>
    <div class="submit-status" id="submit-status"></div>

    <div class="win-actions">
      <button class="btn-primary" onclick="startGame(); document.getElementById('overlay').classList.remove('show')">Play Again</button>
      <a href="leaderboard.html" class="btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center;">🏆 View Leaderboard</a>
    </div>
  </div>
</div>

<footer>
  Memory Card Match &mdash; open source puzzle game ·
  <a href="https://github.com/hein0417/memory-card-match" target="_blank">View on GitHub</a>
</footer>

<script src="script.js"></script>
</body>
</html>
