<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Card Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --surface: #16161f;
      --card-back: #1e1e2e;
      --accent: #f0c040;
      --accent2: #e05a5a;
      --text: #f0eee8;
      --muted: #666688;
      --radius: 14px;
      --flip-time: 0.5s;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      background-image:
        radial-gradient(ellipse 60% 40% at 50% -10%, rgba(240,192,64,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 110%, rgba(224,90,90,0.08) 0%, transparent 60%);
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      line-height: 1;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat {
      background: var(--surface);
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 10px 24px;
      text-align: center;
      min-width: 100px;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d0d14;
    }
    .btn-primary:hover { background: #f7d06a; transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid #2a2a3a;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .difficulty-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .diff-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid #2a2a3a;
      padding: 8px 14px;
      font-size: 0.8rem;
    }

    .diff-btn.active {
      background: #2a2a3a;
      color: var(--accent);
      border-color: var(--accent);
    }

    /* GRID */
    .grid {
      display: grid;
      gap: 14px;
      justify-content: center;
    }

    .grid[data-cols="4"] { grid-template-columns: repeat(4, 1fr); }
    .grid[data-cols="5"] { grid-template-columns: repeat(5, 1fr); }
    .grid[data-cols="6"] { grid-template-columns: repeat(6, 1fr); }

    /* CARD */
    .card {
      width: clamp(68px, 14vw, 100px);
      aspect-ratio: 1;
      perspective: 800px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform var(--flip-time) cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: var(--radius);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      background: var(--card-back);
      border: 1.5px solid #2a2a3a;
      font-size: 1.4rem;
      color: #2a2a3a;
      transition: border-color 0.2s;
    }

    .card:hover:not(.flipped):not(.matched) .card-back {
      border-color: var(--accent);
    }

    .card-back::after {
      content: '?';
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #2e2e40;
    }

    .card-front {
      background: #1a1a2e;
      border: 1.5px solid #2a2a3a;
      transform: rotateY(180deg);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      flex-direction: column;
      gap: 4px;
    }

    .card.matched .card-front {
      background: #1a2a1a;
      border-color: #3a5a3a;
      box-shadow: 0 0 18px rgba(80, 200, 80, 0.15);
    }

    .card.wrong .card-inner {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }

    /* WIN OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,13,20,0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }

    .win-box {
      background: var(--surface);
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .win-emoji { font-size: 4rem; display: block; margin-bottom: 16px; }

    .win-box h2 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .win-box p {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    footer {
      margin-top: 44px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>Memory Match</h1>
  <p>Flip cards · find pairs · beat your record</p>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Moves</div>
    <div class="stat-value" id="moves">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Pairs</div>
    <div class="stat-value" id="pairs">0 / 0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Time</div>
    <div class="stat-value" id="timer">0s</div>
  </div>
</div>

<div class="controls">
  <div class="difficulty-bar">
    <button class="diff-btn active" data-cols="4" onclick="setDifficulty(this)">Easy</button>
    <button class="diff-btn" data-cols="5" onclick="setDifficulty(this)">Medium</button>
    <button class="diff-btn" data-cols="6" onclick="setDifficulty(this)">Hard</button>
  </div>
  <button class="btn-primary" onclick="startGame()">New Game</button>
</div>

<div class="grid" id="grid" data-cols="4"></div>

<div class="overlay" id="overlay">
  <div class="win-box">
    <span class="win-emoji">🎉</span>
    <h2>You Won!</h2>
    <p id="win-msg"></p>
    <button class="btn-primary" onclick="startGame(); document.getElementById('overlay').classList.remove('show')">Play Again</button>
  </div>
</div>

<footer>
  Memory Card Match &mdash; open source puzzle game ·
  <a href="https://github.com/" target="_blank">View on GitHub</a>
</footer>

<script>
  const EMOJIS = [
    '🦊','🐬','🦋','🌸','🍄','⚡','🎸','🏔️',
    '🦑','🌙','🔮','🎯','🍉','🦚','🌊','🎪',
    '🦩','🍀','🎭','🛸','🌋','🎨','🦀','🌺',
    '🐉','🎠','🦜','🍋','🌌','🎲','🦁','🐳',
    '🎡','🌈','🦋','🎻'
  ];

  let cols = 4;
  let flipped = [];
  let matched = 0;
  let total = 0;
  let moves = 0;
  let lock = false;
  let timerInterval = null;
  let seconds = 0;
  let started = false;

  function setDifficulty(btn) {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cols = parseInt(btn.dataset.cols);
    startGame();
  }

  function startGame() {
    clearInterval(timerInterval);
    seconds = 0; moves = 0; matched = 0; flipped = []; lock = false; started = false;
    updateStats();

    // cols x rows must be even
    let rows = cols === 4 ? 4 : cols === 5 ? 4 : 5;
    let count = cols * rows;
    if (count % 2 !== 0) { rows++; count = cols * rows; }
    total = count / 2;

    const pool = [...EMOJIS].sort(() => Math.random() - 0.5).slice(0, total);
    const cards = [...pool, ...pool].sort(() => Math.random() - 0.5);

    const grid = document.getElementById('grid');
    grid.setAttribute('data-cols', cols);
    grid.innerHTML = '';

    cards.forEach((emoji, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.dataset.index = i;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${emoji}</div>
        </div>`;
      card.addEventListener('click', () => flipCard(card));
      grid.appendChild(card);
    });

    document.getElementById('pairs').textContent = `0 / ${total}`;
    document.getElementById('overlay').classList.remove('show');
  }

  function flipCard(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;

    if (!started) {
      started = true;
      timerInterval = setInterval(() => {
        seconds++;
        document.getElementById('timer').textContent = seconds + 's';
      }, 1000);
    }

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      moves++;
      document.getElementById('moves').textContent = moves;
      lock = true;

      const [a, b] = flipped;
      if (a.dataset.emoji === b.dataset.emoji) {
        setTimeout(() => {
          a.classList.add('matched'); b.classList.add('matched');
          a.classList.remove('flipped'); b.classList.remove('flipped');
          flipped = []; lock = false; matched++;
          document.getElementById('pairs').textContent = `${matched} / ${total}`;
          if (matched === total) win();
        }, 400);
      } else {
        setTimeout(() => {
          a.classList.add('wrong'); b.classList.add('wrong');
          setTimeout(() => {
            a.classList.remove('flipped','wrong');
            b.classList.remove('flipped','wrong');
            flipped = []; lock = false;
          }, 400);
        }, 700);
      }
    }
  }

  function win() {
    clearInterval(timerInterval);
    document.getElementById('win-msg').textContent =
      `${moves} moves · ${seconds} seconds · ${total} pairs found`;
    setTimeout(() => document.getElementById('overlay').classList.add('show'), 400);
  }

  function updateStats() {
    document.getElementById('moves').textContent = '0';
    document.getElementById('pairs').textContent = '0 / 0';
    document.getElementById('timer').textContent = '0s';
  }

  startGame();
</script>
</body>
</html>
